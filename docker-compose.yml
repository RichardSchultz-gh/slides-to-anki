services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: anki
      POSTGRES_PASSWORD: anki
      POSTGRES_DB: anki
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anki"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
